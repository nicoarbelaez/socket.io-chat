<!doctype html>
<html lang="es" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Chat 🔒</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @import 'tailwindcss';
      /* activar variantes dark sólo cuando <html class="dark"> */
      @custom-variant dark (&:where(.dark, .dark *));

      /* Inputs */
      [type='text'] {
        @apply w-full rounded-lg border border-gray-300 bg-white p-3
                focus:ring-2 focus:ring-emerald-600 focus:outline-none
                dark:border-gray-600 dark:bg-gray-700 dark:focus:ring-emerald-400;
      }

      /* Botones genéricos */
      button:not(.back-button) {
        @apply transition-colors duration-200 ease-in-out hover:opacity-90;
      }

      /* Body y contenedor principal */
      body {
        @apply flex min-h-screen items-center justify-center
                bg-slate-200 dark:bg-slate-900;
      }

      .screen {
        @apply flex md:h-[95vh] h-dvh md:w-11/12 w-dvh max-w-md flex-col overflow-hidden
                rounded-xl bg-white shadow-2xl dark:bg-gray-800;
      }

      .hidden {
        @apply hidden;
      }

      /* Grupos */
      .group-item {
        @apply flex cursor-pointer items-center rounded-lg border-b
                border-emerald-400 bg-emerald-50 p-3
                dark:border-emerald-700 dark:bg-emerald-800;
      }
      .group-info {
        @apply ml-3 flex-1;
      }
      .group-name {
        @apply font-medium text-gray-900 dark:text-white;
      }
      .group-last-message {
        @apply text-sm text-gray-600 dark:text-gray-400;
      }
      .notification-badge {
        @apply relative mx-2 my-1 flex size-6 items-center justify-center;
      }
      .notification-ping {
        @apply absolute inline-flex h-full w-full
                rounded-full bg-emerald-600 opacity-75 motion-safe:animate-ping;
      }
      .notification-circle {
        @apply relative inline-flex size-6 items-center justify-center
                rounded-full bg-emerald-600 text-sm font-medium text-white;
      }

      /* Mensajes */
      .message {
        @apply relative my-2 max-w-3/4  min-w-22 rounded-lg px-2.5 pt-2 pb-6 break-words dark:text-white;
      }
      .message-sent {
        @apply self-end bg-emerald-200 dark:bg-emerald-700;
      }
      .message-received {
        @apply self-start bg-emerald-50 dark:bg-gray-700;
      }
      .message-username {
        @apply mb-1 font-bold text-gray-900 dark:text-white;
      }
      .message-status {
        @apply absolute right-4 bottom-2 text-xs whitespace-nowrap text-gray-500
                dark:text-gray-400;
      }

      /* Scroll‑to‑bottom bounce */
      #scrollToBottom {
        @apply absolute -top-12 right-6 z-50 size-10
                cursor-pointer items-center justify-center
                rounded-full bg-green-50 p-2 hover:bg-green-200
                motion-safe:animate-bounce dark:bg-gray-700 dark:hover:bg-gray-600;
      }
    </style>
  </head>
  <body>
    <!-- Reemplazo del círculo por avión de papel -->
    <div
      id="circle"
      class="absolute top-1/5 left-1/2 z-50 flex size-12 -translate-x-1/2 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-emerald-600 opacity-75 shadow-lg transition-transform duration-300 hover:rotate-12 hover:bg-green-600 dark:bg-green-600 dark:hover:bg-green-700"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-white"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"
        />
      </svg>
    </div>

    <!-- Botón flotante para cambiar theme -->
    <button
      id="themeToggle"
      class="fixed top-1/2 right-4 z-50 cursor-pointer rounded-full dark:border-2 dark:border-gray-200 p-3 transition-colors focus:outline-none md:top-4 bg-gray-200 dark:bg-transparent"
      aria-label="Toggle Theme"
    >
      <!-- ícono simple de sol/luna -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-gray-800 dark:text-gray-300"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 3v1m0 16v1m8.66-11h-1M4.34 12h-1
             M18.364 5.636l-.707.707M6.343 17.657l-.707.707
             M18.364 18.364l-.707-.707M6.343 6.343l-.707-.707"
        />
        <circle cx="12" cy="12" r="5" class="fill-current" />
      </svg>
    </button>

    <!-- Pantalla de nombre de usuario -->
    <div id="usernameScreen" class="screen">
      <h1 class="mt-4 mb-4 text-center text-4xl font-semibold">
        Symtem Chat 🙊
      </h1>
      <form
        id="usernameForm"
        class="static flex flex-1 flex-col items-center justify-center p-5"
      >
        <label class="mb-4 text-left" for="usernameInput">Nombre</label>
        <input
          type="text"
          id="usernameInput"
          placeholder="Juan Perez"
          required
        />
        <span id="messageError" class="p-2.5 text-sm text-red-600"></span>
        <button
          type="submit"
          class="rounded-lg bg-emerald-600 px-6 py-3 text-white dark:bg-emerald-500 dark:hover:bg-emerald-400 cursor-pointer"
        >
          Continuar
        </button>
      </form>
    </div>

    <!-- Pantalla de grupos -->
    <div id="groupScreen" class="hidden">
      <div class="form-container flex h-full flex-col">
        <div
          class="sticky top-0 z-10 flex items-center bg-emerald-600 p-4 text-white"
        >
          <h3 class="text-lg font-medium">
            Hola, <span id="currentUsername"></span>
          </h3>
          <button class="ml-auto cursor-pointer bg-gray-50/10 rounded-sm px-2" id="logoutButton">
            Cerrar sesión
          </button>
        </div>
        <ul
          id="groupList"
          class="groups-list flex-1 space-y-2 overflow-y-auto p-2"
        >
          <li class="group-item" data-group-id="1" data-group-name="group">
            <div class="group-info">
              <h3 class="group-name">Grupo Familiar 👨👩👧👦</h3>
              <p class="group-last-message">Último mensaje 1</p>
            </div>
            <span class="notification-badge">
              <span class="notification-ping"></span>
              <span class="notification-circle">4</span>
            </span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Pantalla de chat -->
    <div id="chatScreen" class="hidden">
      <nav class="sticky top-0 flex items-center bg-emerald-600 p-4 text-white">
        <button
          id="backButton"
          class="mr-4 cursor-pointer border-0 bg-transparent text-lg text-white"
        >
          ←
        </button>
        <h2 class="text-lg font-medium" id="groupNameTitle">
          Cargando nombre del grupo...
        </h2>
      </nav>

      <div
        id="messagesContainer"
        class="flex flex-1 flex-col overflow-y-auto bg-gray-200 p-2.5 dark:bg-gray-900"
      >
        <div class="message message-sent">
          Mensaje 1 en Grupo 1 - Lorem ipsum dolor sit amet.
          <span class="message-status">10:00 AM ✓</span>
        </div>
        <div class="message message-received">
          <div class="message-username">Usuario</div>
          Mensaje 2 en Grupo 1 - Lorem ipsum dolor sit amet.
          <span class="message-status">10:00 AM ✓</span>
        </div>
      </div>

      <div class="sticky bottom-0 flex bg-white p-2.5 dark:bg-gray-800">
        <input
          type="text"
          class="mr-2.5 flex-1 rounded-3xl border border-gray-300 p-3 dark:border-gray-600 dark:bg-gray-700"
          id="messageInput"
          placeholder="Escribe un mensaje..."
        />
        <button
          id="sendButton"
          class="cursor-pointer rounded-2xl border-0 bg-emerald-600 px-4 py-2.5 text-white dark:bg-emerald-500 dark:hover:bg-emerald-400"
        >
          Enviar
        </button>
        <button id="scrollToBottom">
          <svg
            class="size-6 text-emerald-600"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
          </svg>
        </button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/circle.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/ui.js"></script>
    <script type="module" src="./js/chat.js"></script>
    <script type="module" src="./js/index.js"></script>

    <script>
      const toggle = document.getElementById('themeToggle');
      const root = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') root.classList.add('dark');
      else if (saved === 'light') root.classList.remove('dark');
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.add('dark');

      toggle.addEventListener('click', () => {
        const isDark = root.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    </script>
  </body>
</html>
