<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Chat 🔒</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="circle"></div>

    <div id="usernameScreen" class="screen">
      <div class="form-container">
        <h1>Ingresa tu nombre</h1>
        <form id="usernameForm">
          <input
            type="text"
            id="usernameInput"
            placeholder="Nombre de usuario"
            required
          />
          <span id="messageError"></span>
          <button type="submit" class="submit-button">Continuar</button>
        </form>
      </div>
    </div>
    |
    <div id="groupScreen" class="screen">
      <div class="form-container">
        <div class="user-info">
          <span id="currentUsername"></span>
          <button id="logoutButton" class="logout-button">Cerrar sesión</button>
        </div>
        <h1>Selecciona un grupo</h1>
        <ul id="groupList"></ul>
      </div>
    </div>

    <div id="chatScreen" class="screen">
      <nav class="chat-nav">
        <button id="backButton" class="nav-button">←</button>
        <h2 class="chat-title" id="groupNameTitle">
          Cargando nombre del grupo...
        </h2>
      </nav>

      <div class="chat-container">
        <div class="messages-container" id="messagesContainer">
          <!-- Mensajes de ejemplo -->
          <div class="message received">
            <div class="text">¡Hola a todos! 👋</div>
            <div class="timestamp">10:00 - Juan</div>
          </div>
          <div class="message sent">
            <div class="text">¡Hola Juan! ¿Cómo están?</div>
            <div class="timestamp">10:01 - Yo</div>
          </div>
          <div class="message received">
            <div class="text">Todo bien, ¿van a la reunión hoy?</div>
            <div class="timestamp">10:02 - María</div>
          </div>
        </div>
        <div class="input-container">
          <input
            type="text"
            class="message-input"
            id="messageInput"
            placeholder="Escribe un mensaje..."
          />
          <button class="send-button" id="sendButton">Enviar</button>
        </div>
      </div>
      <button class="scroll-to-bottom" id="scrollToBottom">↓</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/ui.js"></script>
    <script type="module" src="./js/chat.js"></script>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
